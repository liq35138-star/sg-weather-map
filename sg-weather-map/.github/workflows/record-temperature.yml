name: Record hourly Singapore temperatures

on:
  schedule:
    # Every hour at minute 17 (UTC and Singapore have the same minute).
    # Actual start can be delayed by GitHub Actions.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "How many past hours to check (1–168)"
        required: false
        default: "48"

permissions:
  contents: write

concurrency:
  group: record-singapore-temperature
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '48' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install collector dependency
        run: npm install --no-audit --no-fund

      - name: Collect and save hourly temperature
        run: npm run record

      - name: Commit new CSV records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hourly/*.csv
          if git diff --cached --quiet; then
            echo "No new hourly data to commit."
          else
            git commit -m "data: update hourly Singapore temperatures"
            git push
          fi
